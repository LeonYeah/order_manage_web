services:
  mall-admin-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mall-admin-web
    ports:
      - "8090:8090"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace
      - /workspace/node_modules
    restart: unless-stopped
